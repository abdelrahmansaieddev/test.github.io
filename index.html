<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: antiquewhite;
        }
        h1{
            text-align: center ;
        }
        .container{
            display: flex;
            gap: 15px;
        }
        .card{
            background-color: brown;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            flex: 1;
        }
        @media(max-width:1300px)
        {
            .container{
                flex-direction: column;
            }
            .card{
                background-color: blueviolet;
            }
            h1{
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <h1>WE School Students</h1>
    <div class="container">
        <div class="card">student 1</div>
        <div class="card">student 2</div>
        <div class="card">student 3</div>
    </div>
</body>
</html>
